[build-system]
requires = [
    "polib==1.2.0",
    "setuptools==83.0.0",
    "Sphinx==8.1.3",
    "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120

[tool.isort]
# make it compatible with black
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--strict-config --strict-markers"
xfail_strict = true
markers = [
    "scale: bounded high-cardinality tests run once on the designated CI platform",
]
