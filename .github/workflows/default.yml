name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUTF8: "1"

jobs:
  policy:
    name: Policy and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned policy runner
        run: >-
          python -m pip install
          --constraint requirements-release.txt
          "pip==26.1.2"
          "pre-commit==4.6.0"
      - name: Run repository policy hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the minimal Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Install test dependencies
        run: >-
          python -m pip install
          --constraint requirements-release.txt
          "pip==26.1.2"
          "setuptools==83.0.0"
          "wheel==0.47.0"
          "pytest==9.1.1"
          --editable .
      - name: Build native modules
        run: python build.py --modules
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run tests with pytest 9
        run: python -m pytest core hscommon qt/tests

  package:
    name: Package smoke / ${{ matrix.os }}
    needs: policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.14
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install the minimal Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Export deterministic build epoch
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          epoch = subprocess.run(
              ["git", "show", "-s", "--format=%ct", os.environ["GITHUB_SHA"]],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if not epoch.isdecimal():
              raise SystemExit("Git returned an invalid SOURCE_DATE_EPOCH")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"SOURCE_DATE_EPOCH={epoch}\n")
      - name: Install pinned packaging tools
        run: >-
          python -m pip install
          --constraint requirements-release.txt
          "pip==26.1.2"
          "build==1.5.0"
          "twine==6.2.0"
      - name: Build wheel and source distribution
        run: pyproject-build --outdir dist
      - name: Validate package metadata
        run: python scripts/ci_artifact_smoke.py --artifacts dist --twine-check
      - name: Verify byte-for-byte wheel reproducibility from the same sdist
        run: python scripts/ci_artifact_smoke.py --artifacts dist --reproducible-wheel
      - name: Install wheel and sdist in separate clean environments
        run: >-
          python scripts/ci_artifact_smoke.py
          --artifacts dist
          --constraints requirements-release.txt
          --qt-requirement "PyQt6==6.11.0"
      - name: Upload checked package artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  portable:
    name: Desktop package / ${{ matrix.platform }}
    needs: policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-15
            platform: macos
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13.14
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install the minimal Linux Qt runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Export deterministic build epoch
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          epoch = subprocess.run(
              ["git", "show", "-s", "--format=%ct", os.environ["GITHUB_SHA"]],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if not epoch.isdecimal():
              raise SystemExit("Git returned an invalid SOURCE_DATE_EPOCH")
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8", newline="\n") as stream:
              stream.write(f"SOURCE_DATE_EPOCH={epoch}\n")
      - name: Install pinned portable-build tools
        run: >-
          python -m pip install
          --constraint requirements-release.txt
          "pip==26.1.2"
          "setuptools==83.0.0"
          "wheel==0.47.0"
          "polib==1.2.0"
          "sphinx==8.1.3"
          "pyinstaller==6.21.0"
          "packaging==26.2"
          --editable .
      - name: Build native modules, translations, and help
        run: python build.py --clean
      - name: Build and smoke the verified portable GUI
        run: >-
          python scripts/portable_bundle.py build
          --output-directory portable-dist
          --build-root portable-build
      - name: Build and verify the easy-launch EXE or APP
        if: runner.os != 'Linux'
        run: >-
          python scripts/desktop_bundle.py build
          --output-directory desktop-dist
          --portable-build-root portable-build
          --build-root desktop-build
      - name: Upload the checked Windows EXE
        if: >-
          runner.os == 'Windows' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dupeguru-neo-windows-exe-${{ github.sha }}
          path: |
            desktop-dist/*.exe
            desktop-dist/*.exe.sha256
            desktop-dist/README-WINDOWS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload the checked macOS APP
        if: >-
          runner.os == 'macOS' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dupeguru-neo-macos-app-${{ github.sha }}
          path: |
            desktop-dist/*.app.zip
            desktop-dist/*.app.zip.sha256
            desktop-dist/README-MACOS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
