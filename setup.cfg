[metadata]
name = dupeguru-neo
version = attr: core.__version__
url = https://github.com/AiWithYou/dupeguru_neo
project_urls =
    Bug Reports = https://github.com/AiWithYou/dupeguru_neo/issues
    Source = https://github.com/AiWithYou/dupeguru_neo
    Security = https://github.com/AiWithYou/dupeguru_neo/security/policy
author = Andrew Senetar
maintainer = AiWithYou contributors
license_files =
    LICENSE
    THIRD_PARTY_NOTICES.md
    hscommon/LICENSE
description = Verified duplicate detection and large media-library organization.
long_description = file:README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: End Users/Desktop
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3 :: Only
    Topic :: Desktop Environment :: File Managers

[options]
packages = find:
py_modules =
    run
    run_cli
python_requires = >=3.10
install_requires =
    mutagen>=1.46.0,<2.0.0
    distro>=1.8.0,<2.0.0
    Pillow>=12.0.0,<13.0.0
    PyQt6>=6.11.0,<7.0.0
    pywin32>=304; sys_platform == 'win32'
    semantic-version>=2.0.0,<3.0.0
    xxhash>=3.0.0,<4.0.0
include_package_data = false

[options.package_data]
images =
    *.png
    *.ico
    *.icns

[options.packages.find]
exclude =
    core.tests
    core.tests.*
    hscommon.tests
    hscommon.tests.*
    qt.tests
    qt.tests.*
    scripts
    scripts.*

[options.exclude_package_data]
core.pe =
    modules/*
qt.pe =
    modules/*

[options.extras_require]
test =
    pytest>=9.1.0,<10.0.0
    black>=26.5.0,<27.0.0
    flake8>=7.3.0,<8.0.0
build =
    polib>=1.2.0,<2.0.0
    pyinstaller>=6.21.0,<7.0.0
    sphinx>=8.1.3,<9.0.0

[options.entry_points]
console_scripts =
    dupeguru = core.cli:main
gui_scripts =
    dupeguru-gui = run:main
