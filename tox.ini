[tox]
envlist = py310,py311,py312,py313,py314
skipsdist = True
skip_missing_interpreters = False

[testenv]
setenv =
    PYTHON="{envpython}"
commands =
    python build.py --modules
    flake8
    black --check .
    {posargs:python -m pytest core hscommon qt/tests}
deps =
    -c{toxinidir}/requirements-release.txt
    -r{toxinidir}/requirements.txt
    pytest==9.1.1
    flake8==7.3.0
    black==26.5.1

[flake8]
exclude = .tox,env*,build,help,pkg
max-line-length = 120
select = C,E,F,W,B,B950
extend-ignore = E203,W503
